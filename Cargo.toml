[package]
name = "tjc-commutator"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "tjc-commutator-v0-1-1"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui_plot = "0.31"
serialport = "4.7"
axum = "0.8"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
libc = "0.2"
